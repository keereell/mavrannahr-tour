# Netlify configuration for Mavrannahr Tour
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  # No build step — pure static

# ─── Error pages ───
# 404 is automatically served from /404.html (no config needed)

[[redirects]]
  from = "/500"
  to   = "/500.html"
  status = 500
  force = false

[[redirects]]
  from = "/503"
  to   = "/503.html"
  status = 503
  force = false

[[redirects]]
  from = "/offline"
  to   = "/offline.html"
  status = 200

# ─── Security headers ───
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Cache static assets aggressively
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages — short cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Disallow indexing of partials
[[headers]]
  for = "/partials/*"
  [headers.values]
    X-Robots-Tag = "noindex"
